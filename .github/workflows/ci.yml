name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: >-
          python -m pytest -q
          --ignore=tests/test_anatomical_views.py
          --ignore=tests/test_corridor_overlay.py
          --ignore=tests/test_desktop.py
          --ignore=tests/test_intended_planning.py
          --ignore=tests/test_planning_layout.py
          --ignore=tests/test_planning_overlays.py
          --ignore=tests/test_trajectory_views.py
      - run: python -m skullbase_corridor.cli doctor

  desktop:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install --yes libegl1
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[desktop,test]"
      - name: Run GUI files in isolated processes
        shell: bash
        run: |
          set -euo pipefail
          run_gui_test() {
            local test_file="$1"
            local log_file
            log_file="$(mktemp)"
            set +e
            python -m pytest -q "$test_file" 2>&1 | tee "$log_file"
            local pytest_status="${PIPESTATUS[0]}"
            set -e
            if [[ "$pytest_status" -eq 134 ]] &&
               grep -qE 'passed in ' "$log_file" &&
               grep -q 'bool_dealloc: deallocating True or False' "$log_file"
            then
              echo "::warning::Ignoring PySide 6.12 Linux finalization abort after passing $test_file"
            elif [[ "$pytest_status" -ne 0 ]]
            then
              return "$pytest_status"
            fi
          }
          for test_file in \
            tests/test_anatomical_views.py \
            tests/test_corridor_overlay.py \
            tests/test_desktop.py \
            tests/test_intended_planning.py \
            tests/test_planning_layout.py \
            tests/test_planning_overlays.py \
            tests/test_trajectory_views.py
          do
            run_gui_test "$test_file"
          done

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install build
      - run: python -m build
