name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: >-
          python -m pytest -q
          --ignore=tests/test_anatomical_views.py
          --ignore=tests/test_corridor_overlay.py
          --ignore=tests/test_desktop.py
          --ignore=tests/test_intended_planning.py
          --ignore=tests/test_planning_layout.py
          --ignore=tests/test_planning_overlays.py
          --ignore=tests/test_trajectory_views.py
      - run: python -m skullbase_corridor.cli doctor

  desktop:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install --yes libegl1
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[desktop,test]" "PySide6==6.11.2"
      - name: Run GUI files in isolated processes
        shell: bash
        run: |
          set -euo pipefail
          for test_file in \
            tests/test_anatomical_views.py \
            tests/test_corridor_overlay.py \
            tests/test_desktop.py \
            tests/test_intended_planning.py \
            tests/test_planning_layout.py \
            tests/test_planning_overlays.py \
            tests/test_trajectory_views.py
          do
            python -m pytest -q "$test_file"
          done

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install build
      - run: python -m build
